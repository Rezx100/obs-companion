[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:display]
command=Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
priority=10
autorestart=true

[program:window-manager]
command=fluxbox
priority=20
autorestart=true

[program:audio]
command=pulseaudio --daemonize=no --exit-idle-time=-1
priority=20
autorestart=true

[program:obs]
command=dbus-run-session -- obs --disable-shutdown-check --disable-updater
priority=30
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true

[program:egress]
command=node /app/src/server-egress.cjs
priority=30
autorestart=true

[program:studio]
command=node /app/deploy/wait-for-obs.cjs
priority=40
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
